<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 50" width="195" height="50">
  <rect width="195" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <g transform="translate(8, 5)">
    <!-- Ashoka Lion Emblem (State Emblem of India) -->
    <g fill="#0F172A">
      <!-- Top Lions Silhouette -->
      <path d="M 14 3 C 12 1 15 -1 17 -1 C 19 -1 22 1 20 3 C 22 4 24 6 23 9 C 22 12 19 13 17 13 C 15 13 12 12 11 9 C 10 6 12 4 14 3 Z"/>
      <path d="M 9 7 C 7 5 4 7 5 9 C 3 11 3 14 5 16 C 7 17 10 16 11 14 C 11 11 9 9 9 7 Z"/>
      <path d="M 25 7 C 27 5 30 7 29 9 C 31 11 31 14 29 16 C 27 17 24 16 23 14 C 23 11 25 9 25 7 Z"/>
      <!-- Mane & Chest -->
      <path d="M 12 13 C 10 16 11 21 14 24 L 20 24 C 23 21 24 16 22 13 Z"/>
      <!-- Abacus Base -->
      <rect x="7" y="24" width="20" height="3" rx="0.5"/>
      <!-- Ashoka Chakra on Abacus -->
      <circle cx="17" cy="25.5" r="1.2" fill="#FFFFFF"/>
      <circle cx="17" cy="25.5" r="0.6" fill="#0F172A"/>
      <!-- Bell Capital Base -->
      <path d="M 9 27 L 25 27 L 23 31 L 11 31 Z"/>
      <rect x="8" y="31" width="18" height="1.5" rx="0.5"/>
      <!-- Satyameva Jayate Base Bar -->
      <rect x="10" y="33.5" width="14" height="1" rx="0.3"/>
    </g>

    <!-- Right Side: DPIIT + #startupindia -->
    <g transform="translate(35, 1)">
      <!-- DPIIT Title -->
      <text x="0" y="17" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#000000" letter-spacing="-0.3">DPIIT</text>
      
      <!-- #startupindia text with blue 'i' -->
      <g transform="translate(0, 30)">
        <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="-0.4">
          <tspan fill="#F95700">#startupind</tspan>
          <tspan fill="#003399">i</tspan>
          <tspan fill="#F95700">a</tspan>
        </text>
        
        <!-- Green Step Line under 'ia' -->
        <path d="M 68 2 L 73 2 L 73 6 L 82 6" fill="none" stroke="#28A745" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
      </g>
    </g>
  </g>
</svg>
