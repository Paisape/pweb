version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=paisape_db
      - DB_USER=root
      - DB_PASS=rootpassword

  db:
    image: mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=paisape_db
    volumes:
      - db_data:/var/lib/mysql
      - ./admin/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
