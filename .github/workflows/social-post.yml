name: Auto Social Post on Blog Publish

on:
  push:
    branches: [main]
    paths:
      - 'blog/*/index.php'   # Only triggers when a blog post is added/updated
  workflow_dispatch:        # Allows manual trigger from GitHub UI
    inputs:
      blog_slug:
        description: 'Blog slug to post manually (e.g. what-is-mid-and-tid)'
        required: false
        default: ''

jobs:
  social-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history to accurately detect push diffs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write social post script
        run: |
          cat << 'SCRIPT' > /tmp/social_post.js
          const { execSync } = require('child_process');
          const fs = require('fs');

          const TOKEN    = process.env.BUFFER_TOKEN;
          const LINKEDIN = process.env.BUFFER_LINKEDIN_ID;
          const FACEBOOK = process.env.BUFFER_FACEBOOK_ID;
          const MANUAL_SLUG = process.env.MANUAL_SLUG;
          const SITE_URL = 'https://paisape.in';
          const GITHUB_RAW = 'https://raw.githubusercontent.com/Paisape/pweb/main';

          if (!TOKEN) {
            console.log('⚠️ No BUFFER_TOKEN found in GitHub Secrets. Skipping social post.');
            process.exit(0);
          }

          let newPosts = [];

          if (MANUAL_SLUG && MANUAL_SLUG.trim() !== '') {
            const manualPath = `blog/${MANUAL_SLUG.trim()}/index.php`;
            if (fs.existsSync(manualPath)) {
              newPosts = [manualPath];
              console.log(`📌 Manual trigger for blog: ${manualPath}`);
            } else {
              console.error(`❌ Manual blog path not found: ${manualPath}`);
              process.exit(1);
            }
          } else {
            // Detect newly added or updated blog/*/index.php files in this push
            let diff = '';
            try {
              const beforeSha = process.env.BEFORE_SHA;
              const currentSha = process.env.CURRENT_SHA;
              if (beforeSha && currentSha && beforeSha !== '0000000000000000000000000000000000000000') {
                diff = execSync(`git diff --name-only ${beforeSha} ${currentSha}`).toString();
              } else {
                diff = execSync('git diff --name-only HEAD~1 HEAD').toString();
              }
            } catch(e) {
              try {
                diff = execSync('git diff --name-only HEAD~1 HEAD').toString();
              } catch(err) {
                console.log('Could not get git diff:', err.message);
              }
            }

            newPosts = diff.split('\n')
              .map(f => f.trim())
              .filter(f => /^blog\/.+\/index\.php$/.test(f))
              .filter(f => f !== 'blog/index.php');
          }

          if (newPosts.length === 0) {
            console.log('ℹ️ No new or modified blog posts in this push — skipping social post.');
            process.exit(0);
          }

          console.log('📌 Blog posts to publish:', newPosts);

          // Parse metadata directly from the PHP file
          function parseMeta(filePath) {
            const c = fs.readFileSync(filePath, 'utf8');

            const ogTitleM = c.match(/meta property="og:title" content="([^"]+)"/i);
            const titleM   = c.match(/<title>([^<]+)<\/title>/i);
            const descM    = c.match(/meta name="description" content="([^"]+)"/i);
            const imgM     = c.match(/og:image[^>]+content="([^"]+)"/i);

            let rawTitle = '';
            if (ogTitleM && ogTitleM[1]) {
              rawTitle = ogTitleM[1].trim();
            } else if (titleM && titleM[1]) {
              rawTitle = titleM[1].replace(/\s+[—\-]\s+Paisape.*$/i, '').trim();
            }

            const title = rawTitle.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
            const rawDesc = descM ? descM[1].trim() : '';
            const desc  = rawDesc.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");

            let image = GITHUB_RAW + '/assets/paisape-og-banner.jpg';
            if (imgM) {
              const imgUrl = imgM[1].trim();
              image = imgUrl.replace(SITE_URL, GITHUB_RAW);
            }

            return { title, desc, image };
          }

          // Post to Buffer API
          async function postToBuffer(channelId, text, title, desc, blogUrl, imageUrl, isFacebook) {
            const la = {
              url: blogUrl,
              title: title,
              description: desc,
              thumbnail: { url: imageUrl }
            };

            const laStr = `{
              url: ${JSON.stringify(la.url)},
              title: ${JSON.stringify(la.title)},
              description: ${JSON.stringify(la.description)},
              thumbnail: { url: ${JSON.stringify(la.thumbnail.url)} }
            }`;

            const metaField = isFacebook
              ? `metadata: { facebook: { type: post, linkAttachment: ${laStr} } }`
              : `metadata: { linkedin: { linkAttachment: ${laStr} } }`;

            const mutation = `
              mutation {
                createPost(input: {
                  channelId: ${JSON.stringify(channelId)},
                  text: ${JSON.stringify(text)},
                  schedulingType: automatic,
                  mode: shareNow,
                  ${metaField}
                }) {
                  ... on PostActionSuccess { post { id status } }
                  ... on MutationError { message }
                }
              }
            `;

            const res = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + TOKEN,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ query: mutation })
            });

            const data = await res.json();
            if (data.errors) {
              console.error('  ❌ Buffer API Error:', data.errors[0].message);
              return;
            }
            const result = data.data?.createPost;
            if (result?.post) {
              console.log(`  ✅ Posted to Buffer! ID: ${result.post.id} | Status: ${result.post.status}`);
            } else if (result?.message) {
              console.error('  ❌ Buffer API Failed:', result.message);
            }
          }

          // Main Workflow Execution
          (async () => {
            for (const filePath of newPosts) {
              const slug    = filePath.split('/')[1];
              const blogUrl = `${SITE_URL}/blog/${slug}`;
              const { title, desc, image } = parseMeta(filePath);

              console.log(`\n==================================================`);
              console.log(`📝 Processing Blog Post: ${slug}`);
              console.log(`   Title : ${title}`);
              console.log(`   Desc  : ${desc.substring(0, 90)}...`);
              console.log(`   Image : ${image}`);
              console.log(`   URL   : ${blogUrl}`);
              console.log(`==================================================\n`);

              // Poll web server until HTTP 200 OK and non-404 body content is confirmed
              console.log(`⏳ Verifying Coolify web server deployment of ${blogUrl}...`);
              let isLive = false;
              const maxAttempts = 45; // 45 attempts * 10s = 7.5 minutes max polling window

              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                try {
                  const res = await fetch(blogUrl, {
                    method: 'GET',
                    headers: {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36 PaisapeDeployBot/1.0'
                    }
                  });

                  if (res.status === 200) {
                    const htmlText = await res.text();
                    if (!htmlText.includes('404 Not Found') && !htmlText.includes('404 Page Not Found')) {
                      console.log(`  ✅ COOLIFY DEPLOYMENT VERIFIED LIVE! Server returned HTTP 200 OK with valid page content (Attempt ${attempt}/${maxAttempts})`);
                      isLive = true;
                      break;
                    } else {
                      console.log(`  [Attempt ${attempt}/${maxAttempts}] HTTP 200 returned but body contains 404 message. Waiting 10s for Coolify...`);
                    }
                  } else {
                    console.log(`  [Attempt ${attempt}/${maxAttempts}] Status: ${res.status}. Coolify deploying... Waiting 10s...`);
                  }
                } catch(e) {
                  console.log(`  [Attempt ${attempt}/${maxAttempts}] Web server not responding yet... (${e.message}). Waiting 10s...`);
                }
                await new Promise(r => setTimeout(r, 10000));
              }

              // STRICT SAFETY GUARD: Do NOT publish to social media if URL is 404 / not live!
              if (!isLive) {
                console.error(`\n❌ DEPLOYMENT TIMED OUT: ${blogUrl} is NOT live (returned 404 or non-200 status).`);
                console.error(`🛑 ABORTING SOCIAL POSTING TO PREVENT PUBLISHING 404 LINKS ON FACEBOOK & LINKEDIN.`);
                process.exit(1);
              }

              // Warmup pause (15 seconds) so Coolify web server cache is completely warmed up for social crawlers
              console.log('☕ Warmup pause (15s) for social crawler cache...');
              await new Promise(r => setTimeout(r, 15000));

              const liText = `📰 New on Paisape Engineering Blog\n\n${title}\n\n${desc}\n\n👉 ${blogUrl}\n\n#Fintech #India #Payments #Engineering #Paisape`;
              const fbText = `🆕 New Blog Post!\n\n${title}\n\n${desc}\n\n${blogUrl}\n\n#Fintech #India #Payments`;

              console.log('\n🚀 Dispatching to LinkedIn via Buffer...');
              await postToBuffer(LINKEDIN, liText, title, desc, blogUrl, image, false);

              console.log('\n🚀 Dispatching to Facebook via Buffer...');
              await postToBuffer(FACEBOOK, fbText, title, desc, blogUrl, image, true);
            }
            console.log('\n🎉 Social posting workflow executed successfully!');
          })();
          SCRIPT

      - name: Post to LinkedIn and Facebook
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_LINKEDIN_ID: ${{ secrets.BUFFER_LINKEDIN_ID }}
          BUFFER_FACEBOOK_ID: ${{ secrets.BUFFER_FACEBOOK_ID }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          MANUAL_SLUG: ${{ github.event.inputs.blog_slug }}
        run: node /tmp/social_post.js
