name: Auto Social Post on Blog Publish

on:
  push:
    branches: [main]
  repository_dispatch:     # Triggered by Coolify post-deployment webhook
    types: [coolify_deployed]
  workflow_dispatch:       # Allows manual trigger from GitHub UI
    inputs:
      blog_slug:
        description: 'Blog slug to post manually (e.g. upi-mdr-effects)'
        required: false
        default: 'upi-mdr-effects'

jobs:
  social-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Social Publisher
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_LINKEDIN_ID: ${{ secrets.BUFFER_LINKEDIN_ID }}
          BUFFER_FACEBOOK_ID: ${{ secrets.BUFFER_FACEBOOK_ID }}
          BLOG_SLUG: ${{ github.event.inputs.blog_slug || github.event.client_payload.blog_slug }}
        run: node scripts/publish_social.js
