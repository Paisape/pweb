name: Auto Social Post on Blog Publish

on:
  push:
    branches: [main]
    paths:
      - 'blog/*/index.php'   # Only triggers when a new blog post is added

jobs:
  social-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Need previous commit to detect what's new

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write social post script
        run: |
          cat << 'SCRIPT' > /tmp/social_post.js
          const { execSync } = require('child_process');
          const fs = require('fs');

          const TOKEN    = process.env.BUFFER_TOKEN;
          const LINKEDIN = process.env.BUFFER_LINKEDIN_ID;
          const FACEBOOK = process.env.BUFFER_FACEBOOK_ID;
          const SITE_URL = 'https://paisape.in';
          // GitHub raw CDN — image available IMMEDIATELY on push, no deployment wait
          const GITHUB_RAW = 'https://raw.githubusercontent.com/Paisape/pweb/main';

          if (!TOKEN) {
            console.log('No BUFFER_TOKEN — add it in GitHub Secrets. Skipping.');
            process.exit(0);
          }

          // Detect newly added blog/*/index.php files in this push
          let diff = '';
          try {
            diff = execSync('git diff --name-only --diff-filter=A HEAD~1 HEAD').toString();
          } catch(e) {
            diff = execSync('git diff --name-only HEAD~1 HEAD').toString();
          }

          const newPosts = diff.split('\n')
            .map(f => f.trim())
            .filter(f => /^blog\/.+\/index\.php$/.test(f))
            .filter(f => f !== 'blog/index.php');

          if (newPosts.length === 0) {
            console.log('No new blog posts in this push — skipping social post.');
            process.exit(0);
          }

          console.log('New posts detected:', newPosts);

          // Parse metadata directly from the PHP file
          function parseMeta(filePath) {
            const c = fs.readFileSync(filePath, 'utf8');

            const ogTitleM = c.match(/meta property="og:title" content="([^"]+)"/i);
            const titleM   = c.match(/<title>([^<]+)<\/title>/i);
            const descM    = c.match(/meta name="description" content="([^"]+)"/i);
            const imgM     = c.match(/og:image[^>]+content="([^"]+)"/i);

            let rawTitle = '';
            if (ogTitleM && ogTitleM[1]) {
              rawTitle = ogTitleM[1].trim();
            } else if (titleM && titleM[1]) {
              rawTitle = titleM[1].replace(/\s+[—\-]\s+Paisape.*$/i, '').trim();
            }

            // Unescape common HTML entities
            const title = rawTitle.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");
            const rawDesc = descM ? descM[1].trim() : '';
            const desc  = rawDesc.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'");

            // Convert production image URL → GitHub raw CDN URL (available immediately on push)
            let image = GITHUB_RAW + '/assets/paisape-og-banner.jpg';
            if (imgM) {
              const imgUrl = imgM[1].trim();
              image = imgUrl.replace(SITE_URL, GITHUB_RAW);
            }

            return { title, desc, image };
          }

          // Post to Buffer with rich link attachment
          async function postToBuffer(channelId, text, title, desc, blogUrl, imageUrl, isFacebook) {
            const la = {
              url: blogUrl,
              title: title,
              description: desc,
              thumbnail: { url: imageUrl }
            };

            const laStr = `{
              url: ${JSON.stringify(la.url)},
              title: ${JSON.stringify(la.title)},
              description: ${JSON.stringify(la.description)},
              thumbnail: { url: ${JSON.stringify(la.thumbnail.url)} }
            }`;

            const metaField = isFacebook
              ? `metadata: { facebook: { type: post, linkAttachment: ${laStr} } }`
              : `metadata: { linkedin: { linkAttachment: ${laStr} } }`;

            const mutation = `
              mutation {
                createPost(input: {
                  channelId: ${JSON.stringify(channelId)},
                  text: ${JSON.stringify(text)},
                  schedulingType: automatic,
                  mode: shareNow,
                  ${metaField}
                }) {
                  ... on PostActionSuccess { post { id status } }
                  ... on MutationError { message }
                }
              }
            `;

            const res = await fetch('https://api.buffer.com', {
              method: 'POST',
              headers: {
                'Authorization': 'Bearer ' + TOKEN,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ query: mutation })
            });

            const data = await res.json();
            if (data.errors) {
              console.error('  ❌ Error:', data.errors[0].message);
              return;
            }
            const result = data.data?.createPost;
            if (result?.post) {
              console.log(`  ✅ Posted! ID: ${result.post.id} | Status: ${result.post.status}`);
            } else if (result?.message) {
              console.error('  ❌ Failed:', result.message);
            }
          }

          // Main
          (async () => {
            for (const filePath of newPosts) {
              const slug    = filePath.split('/')[1];
              const blogUrl = `${SITE_URL}/blog/${slug}`;
              const { title, desc, image } = parseMeta(filePath);

              console.log(`\n📝 Blog: ${slug}`);
              console.log(`   Title : ${title}`);
              console.log(`   Desc  : ${desc.substring(0, 80)}...`);
              console.log(`   Image : ${image}`);
              console.log(`   URL   : ${blogUrl}`);

              const liText = `📰 New on Paisape Engineering Blog\n\n${title}\n\n${desc}\n\n👉 ${blogUrl}\n\n#Fintech #India #Payments #Engineering #Paisape`;
              const fbText = `🆕 New Blog Post!\n\n${title}\n\n${desc}\n\n${blogUrl}\n\n#Fintech #India #Payments`;

              console.log('\n  → LinkedIn...');
              await postToBuffer(LINKEDIN, liText, title, desc, blogUrl, image, false);

              console.log('  → Facebook...');
              await postToBuffer(FACEBOOK, fbText, title, desc, blogUrl, image, true);
            }
            console.log('\n✅ Social posting complete!');
          })();
          SCRIPT

      - name: Post to LinkedIn and Facebook
        env:
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_LINKEDIN_ID: ${{ secrets.BUFFER_LINKEDIN_ID }}
          BUFFER_FACEBOOK_ID: ${{ secrets.BUFFER_FACEBOOK_ID }}
        run: node /tmp/social_post.js
